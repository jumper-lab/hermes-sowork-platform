name: Plugin compatibility
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        hermes:
          - d923a5eb487a17c0a68801bba9ef0f56c81040a8
          - e868508f5d341bc8dcaa827eb1d61c45ad14ddca
    runs-on: ${{ matrix.os }}
    env:
      HERMES_HOME: ${{ runner.temp }}/hermes-profile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes }}
          path: hermes-runtime
          persist-credentials: false
      - name: Build isolated native test environment
        working-directory: hermes-runtime
        run: python -m pm.build_env --source . --out "$RUNNER_TEMP/hermes-tests" --group dev --group test
      - name: Export clean public source
        run: python scripts/export_public.py --output "$RUNNER_TEMP/sowork-public"
      - name: Native gateway and plugin tests
        run: python "$RUNNER_TEMP/sowork-public/scripts/verify.py" --hermes hermes-runtime --venv "$RUNNER_TEMP/hermes-tests" --output "$RUNNER_TEMP/results"
      - name: Catalog admission and dependency validation
        working-directory: hermes-runtime
        env:
          HERMES_PYTHON: ${{ runner.temp }}/hermes-tests/bin/python
        run: scripts/run-in-hermes-env hermes plugins validate "$RUNNER_TEMP/sowork-public" --install-deps --json
