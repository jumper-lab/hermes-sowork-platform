[project]
name = "hermes-sowork-platform"
version = "0.15.0"
description = "SoWork conversations with explicit user/channel routes, contextual prompts, previews and media for Hermes"
requires-python = ">=3.11,<3.15"
dependencies = ["httpx>=0.28.1,<0.29", "markdown-it-py>=3.0,<5"]
license = {text = "MIT"}
readme = "README.md"

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
